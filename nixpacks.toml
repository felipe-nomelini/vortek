[variables]
NIXPACKS_NODE_VERSION = "22"
NEXT_TELEMETRY_DISABLED = "1"

[phases.install]
dependsOn = ["setup"]
cmds = ["npm ci --no-audit --prefer-offline --progress=false"]
onlyIncludeFiles = ["package.json", "package-lock.json"]

# BNT-AI-02: runtime only; credentials/profile belong to a private persistent mount.
[phases.codex]
dependsOn = ["install"]
cmds = ["npm install --global @openai/codex@0.153.4 --no-audit --progress=false", "codex --version"]

[phases.build]
dependsOn = ["install", "codex"]
cmds = ["npm run build"]
cacheDirectories = [".next/cache", "node_modules/.cache"]

[start]
cmd = "npm run start"
